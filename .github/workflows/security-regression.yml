name: Security Regression

on:
  pull_request:
    branches:
      - codex/folders-acl
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, static checks, tests, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run syntax validation
        run: npm run validate:syntax

      - name: Run automated tests
        run: npm test

      - name: Audit locked dependencies
        run: npm run validate:dependencies
