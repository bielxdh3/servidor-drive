name: PR17 Playwright analytics XSS validation

on:
  push:
    branches:
      - validation/pr17-playwright-xss-7b270f9

permissions:
  contents: read

jobs:
  analytics-dashboard-xss:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact validation branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install disposable Playwright dependency and Chromium
        run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium

      - name: Run analytics to dashboard XSS text proof
        run: npx playwright test test/playwright-analytics-dashboard-xss.spec.js --reporter=line
