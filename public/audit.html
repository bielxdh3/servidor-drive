<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Root.ark - Auditoria</title>
    <link rel="stylesheet" href="./styles/global.css" />
    <link rel="icon" href="assets/logo.svg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght,XOPQ,XTRA,YOPQ,YTDE,YTFI,YTLC,YTUC@8..144,100..1000,96,468,79,-203,738,514,712&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Sora:wght@100..800&display=swap"
      rel="stylesheet"
    />
    <style>
      body { color: white; }
      .topbar {
        position: fixed; top: 0; left: 0; right: 0;
        display: flex; align-items: center; justify-content: space-between;
        padding: 14px 32px; background: rgba(2,2,2,0.85);
        backdrop-filter: blur(10px); border-bottom: 1px solid #1a1a2e; z-index: 100;
      }
      .brand { font: 800 1.25rem/1 var(--ff-sora); text-transform: uppercase; }
      .brand small { background: linear-gradient(#044879, #60a0ce); padding: 2px 8px; border-radius: 6px; text-transform: lowercase; }
      .topbar-right, .audit-filters, .pagination { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      .btn-sm, .audit-filters button {
        background: none; border: 1px solid #044879; color: #60a0ce;
        font: var(--p-sm); padding: 7px 12px; border-radius: 6px; cursor: pointer; text-decoration: none;
      }
      .btn-sm:hover, .audit-filters button:hover { background: #044879; }
      .page { max-width: 1240px; margin: 0 auto; padding: 110px 32px 60px; }
      .page-title { font: var(--display-sm); margin-bottom: 8px; }
      .page-subtitle { color: #8a8a8a; font: var(--p-md); margin-bottom: 28px; }
      .card {
        background: var(--bg-tertiary); border: 1px solid #044879;
        border-radius: 12px; padding: 20px; margin-bottom: 22px;
      }
      .audit-filters { row-gap: 16px; column-gap: 12px; }
      .audit-filters input, .audit-filters select {
        background: #111012; border: 1px solid #044879; color: white;
        border-radius: 8px; padding: 9px 10px; font: var(--p-sm);
        min-width: 150px;
      }
      .audit-summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
      .summary-card {
        background: var(--bg-tertiary); border: 1px solid #044879;
        border-radius: 12px; padding: 18px;
      }
      .summary-card h4 { font: var(--label-md); color: white; margin-bottom: 6px; }
      .summary-card p { font: var(--p-sm); color: #8a8a8a; }
      .table-wrap { overflow-x: auto; margin-top: 26px; }
      table { width: 100%; border-collapse: collapse; min-width: 980px; }
      th, td { padding: 12px 10px; border-bottom: 1px solid #044879; text-align: left; font: var(--p-sm); }
      th { color: #60a0ce; font-weight: 800; }
      td { color: white; vertical-align: top; }
      .badge { border: 1px solid #044879; border-radius: 999px; padding: 3px 8px; color: #60a0ce; }
      .badge-critical, .badge-error, .badge-failure { color: #ff6b6b; border-color: #a51f1f; }
      .badge-warning, .badge-partial { color: #ffd27a; border-color: #6b4b00; }
      .details-btn { background: transparent; border: 1px solid #044879; color: #60a0ce; border-radius: 8px; padding: 5px 9px; cursor: pointer; }
      .details-modal {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        background: rgba(0, 0, 0, 0.72); z-index: 200; padding: 24px;
      }
      .details-modal.open { display: flex; }
      .details-card {
        width: min(720px, calc(100vw - 32px)); max-height: min(720px, calc(100vh - 48px));
        background: var(--bg-tertiary); border: 1px solid #044879; border-radius: 12px;
        padding: 20px; overflow: hidden; display: flex; flex-direction: column; gap: 14px;
      }
      .details-card h3 { color: #60a0ce; font: var(--label-sm); }
      .details-box {
        color: #d7d7d7; background: #111012; border: 1px solid #044879; border-radius: 10px;
        padding: 14px; white-space: pre-wrap; overflow: auto; font: 0.85rem/1.5 var(--ff-robotoMono);
      }
      .pagination { margin-top: 22px; }
      @media (max-width: 900px) {
        .topbar { position: static; flex-direction: column; gap: 12px; }
        .page { padding-top: 32px; }
        .audit-summary { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="brand">ROOT<small>.ark</small></div>
      <div class="topbar-right">
        <a class="btn-sm" href="/index.html">Arquivos</a>
        <a class="btn-sm" href="/admin.html" id="adminLink" style="display:none">Admin</a>
        <button class="btn-sm" id="btnLogout">Sair</button>
      </div>
    </div>

    <main class="page">
      <h1 class="page-title">Logs de Auditoria</h1>
      <p class="page-subtitle">Rastreabilidade de ações críticas, acessos, permissões e eventos de segurança.</p>

      <section class="card audit-filters">
        <input type="text" id="filterUsername" placeholder="Usuário" />
        <select id="filterEventType">
          <option value="">Todos os eventos</option>
          <option value="auth.login.success">Login bem-sucedido</option>
          <option value="auth.login.failed">Login falho</option>
          <option value="file.upload">Upload</option>
          <option value="file.download">Download</option>
          <option value="file.delete">Deleção de arquivo</option>
          <option value="file.approve">Aprovação</option>
          <option value="user.permission.changed">Permissão alterada</option>
          <option value="user.deleted">Usuário deletado</option>
          <option value="system.anomaly.detected">Anomalia</option>
        </select>
        <select id="filterSeverity">
          <option value="">Todas as severidades</option>
          <option value="info">Info</option>
          <option value="warning">Warning</option>
          <option value="error">Error</option>
          <option value="critical">Critical</option>
        </select>
        <select id="filterResult">
          <option value="">Todos os resultados</option>
          <option value="success">Success</option>
          <option value="failure">Failure</option>
          <option value="partial">Partial</option>
        </select>
        <input type="date" id="filterStartDate" />
        <input type="date" id="filterEndDate" />
        <button type="button" id="btnFilter">Filtrar</button>
        <button type="button" id="btnExport">Exportar CSV</button>
      </section>

      <section class="audit-summary">
        <div class="summary-card"><h4 id="totalLogs">0</h4><p>Total de logs</p></div>
        <div class="summary-card"><h4 id="criticalCount">0</h4><p>Eventos críticos</p></div>
        <div class="summary-card"><h4 id="failedLoginsCount">0</h4><p>Logins falhados</p></div>
      </section>

      <section class="card table-wrap">
        <table>
          <thead>
            <tr>
              <th>Data/Hora</th><th>Evento</th><th>Severidade</th><th>Usuário</th>
              <th>IP</th><th>Alvo</th><th>Resultado</th><th>Detalhes</th>
            </tr>
          </thead>
          <tbody id="auditTableBody"></tbody>
        </table>
      </section>

      <div class="pagination">
        <button class="btn-sm" type="button" id="prevPage">Anterior</button>
        <span id="pageInfo">Página 1</span>
        <button class="btn-sm" type="button" id="nextPage">Próxima</button>
      </div>
    </main>

    <div class="details-modal" id="detailsModal">
      <div class="details-card">
        <h3>Detalhes do log</h3>
        <pre class="details-box" id="detailsContent"></pre>
        <div class="pagination">
          <button class="btn-sm" type="button" id="detailsClose">Fechar</button>
        </div>
      </div>
    </div>

    <script src="/auth/session.js"></script>
    <script src="/auth-bootstrap.js"></script>
    <script>
      const token = "cookie-session";
      const permissions = window.ROOTARK_AUTH.permissions;
      if (!permissions.manageUsers && !permissions.viewAuditLogs) window.location.href = "/login.html";
      if (permissions.manageUsers) document.getElementById("adminLink").style.display = "inline-block";

      let currentPage = 1;
      let totalPages = 1;
      let currentFilters = {};
      let currentLogs = [];
      let realtimeSocket = null;
      let realtimeRefreshTimer = null;

      document.getElementById("btnLogout").addEventListener("click", () => {
        window.rootarkLogout();
      });

      function authFetch(url, opts = {}) {
        return fetch(url, { ...opts, headers: { Authorization: "Bearer " + token, ...(opts.headers || {}) } });
      }

      function escapeHtml(value) {
        const div = document.createElement("div");
        div.textContent = value || "";
        return div.innerHTML;
      }

      function formatTimestamp(iso) {
        const date = new Date(iso);
        return Number.isNaN(date.getTime()) ? "—" : date.toLocaleString("pt-BR");
      }

      function formatTarget(target) {
        if (!target) return "—";
        return `${target.type || "alvo"}: ${target.id || "—"}`;
      }

      function formatIp(ip) {
        if (!ip) return "—";
        if (ip === "::1" || ip === "::ffff:127.0.0.1" || ip === "127.0.0.1") return "localhost";
        return ip;
      }

      function getLogDetails(log) {
        return {
          actor: log.actor || null,
          target: log.target || null,
          action: log.action || "",
          result: log.result || "",
          details: log.details || {},
        };
      }

      function openDetails(index) {
        const log = currentLogs[index];
        if (!log) return;
        document.getElementById("detailsContent").textContent = JSON.stringify(getLogDetails(log), null, 2);
        document.getElementById("detailsModal").classList.add("open");
      }

      function closeDetails() {
        document.getElementById("detailsModal").classList.remove("open");
        document.getElementById("detailsContent").textContent = "";
      }

      function applyFilters() {
        currentFilters = {
          username: document.getElementById("filterUsername").value.trim(),
          eventType: document.getElementById("filterEventType").value,
          severity: document.getElementById("filterSeverity").value,
          result: document.getElementById("filterResult").value,
          startDate: document.getElementById("filterStartDate").value,
          endDate: document.getElementById("filterEndDate").value,
        };
        Object.keys(currentFilters).forEach((key) => {
          if (!currentFilters[key]) delete currentFilters[key];
        });
        currentPage = 1;
        loadAuditLogs();
      }

      async function loadAuditLogs() {
        const params = new URLSearchParams({ page: currentPage, limit: 50, ...currentFilters });
        const response = await authFetch(`/audit/logs?${params}`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Falha ao carregar auditoria.");
        totalPages = Math.max(1, Math.ceil(data.total / data.limit));
        currentLogs = data.logs || [];
        renderAuditTable(currentLogs);
        document.getElementById("pageInfo").textContent = `Página ${data.page} de ${totalPages}`;
      }

      function renderAuditTable(logs) {
        document.getElementById("auditTableBody").innerHTML = logs.length ? logs.map((log, index) => {
          return `
            <tr class="severity-${escapeHtml(log.severity)}">
              <td>${escapeHtml(formatTimestamp(log.timestamp))}</td>
              <td>${escapeHtml(log.eventType)}</td>
              <td><span class="badge badge-${escapeHtml(log.severity)}">${escapeHtml(log.severity)}</span></td>
              <td>${escapeHtml(log.actor?.username || "system")}</td>
              <td>${escapeHtml(formatIp(log.actor?.ip))}</td>
              <td>${escapeHtml(formatTarget(log.target))}</td>
              <td><span class="badge badge-${escapeHtml(log.result)}">${escapeHtml(log.result)}</span></td>
              <td><button class="details-btn" type="button" onclick="openDetails(${index})">Ver</button></td>
            </tr>`;
        }).join("") : '<tr><td colspan="8">Nenhum log encontrado.</td></tr>';
      }

      async function loadAuditSummary() {
        const response = await authFetch("/audit/summary");
        const summary = await response.json();
        if (!response.ok) return;
        document.getElementById("totalLogs").textContent = summary.totalLogs || 0;
        document.getElementById("criticalCount").textContent = summary.bySeverity?.critical || 0;
        document.getElementById("failedLoginsCount").textContent = summary.failedLogins || 0;
      }

      function exportLogs() {
        const params = new URLSearchParams({ format: "csv", ...currentFilters });
        window.open(`/audit/export?${params}`, "_blank");
      }

      document.getElementById("btnFilter").addEventListener("click", applyFilters);
      document.getElementById("btnExport").addEventListener("click", exportLogs);
      document.getElementById("detailsClose").addEventListener("click", closeDetails);
      document.getElementById("detailsModal").addEventListener("click", (event) => {
        if (event.target.id === "detailsModal") closeDetails();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeDetails();
      });
      document.getElementById("prevPage").addEventListener("click", () => {
        currentPage = Math.max(1, currentPage - 1);
        loadAuditLogs();
      });
      document.getElementById("nextPage").addEventListener("click", () => {
        currentPage = Math.min(totalPages, currentPage + 1);
        loadAuditLogs();
      });

      loadAuditSummary();
      loadAuditLogs().catch((error) => {
        document.getElementById("auditTableBody").innerHTML = `<tr><td colspan="8">${escapeHtml(error.message)}</td></tr>`;
      });
      setInterval(loadAuditSummary, 30000);

      function connectRealtime() {
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        realtimeSocket = new WebSocket(`${protocol}//${window.location.host}/ws`);
        realtimeSocket.addEventListener("message", (event) => {
          let message = {};
          try { message = JSON.parse(event.data); } catch { return; }
          if (message.event === "data:changed" && ["audit", "analytics"].includes(message.payload?.source)) {
            clearTimeout(realtimeRefreshTimer);
            realtimeRefreshTimer = setTimeout(() => {
              loadAuditSummary();
              loadAuditLogs();
            }, 250);
          }
        });
        realtimeSocket.addEventListener("close", () => setTimeout(connectRealtime, 3000));
      }

      connectRealtime();
    </script>
  </body>
</html>
