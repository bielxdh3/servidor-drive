<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Root.ark - Backups</title>
    <link rel="stylesheet" href="./styles/global.css" />
    <link rel="icon" href="assets/logo.svg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght,XOPQ,XTRA,YOPQ,YTDE,YTFI,YTLC,YTUC@8..144,100..1000,96,468,79,-203,738,514,712&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Sora:wght@100..800&display=swap"
      rel="stylesheet"
    />
    <style>
      body { color: white; }
      .topbar {
        position: fixed;
        top: 0; left: 0; right: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 32px;
        background: rgba(2,2,2,0.85);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid #1a1a2e;
        z-index: 100;
      }
      .brand {
        font: 800 1.25rem/1 var(--ff-sora);
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .brand small {
        font: 700 0.9rem/1 var(--ff-sora);
        background: linear-gradient(#044879, #60a0ce);
        padding: 2px 8px;
        border-radius: 6px;
        text-transform: lowercase;
      }
      .topbar-right { display: flex; align-items: center; gap: 12px; }
      .btn-sm {
        background: none;
        border: 1px solid #044879;
        color: #60a0ce;
        font: var(--p-sm);
        padding: 5px 12px;
        border-radius: 6px;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
        transition: background 0.2s;
      }
      .btn-sm:hover { background: #044879; }
      .page {
        max-width: 1100px;
        margin: 0 auto;
        padding: 110px 32px 60px;
      }
      .page-title { font: var(--display-sm); margin-bottom: 10px; }
      .page-subtitle { color: #8a8a8a; font: var(--p-md); margin-bottom: 28px; }
      .card {
        background: var(--bg-tertiary);
        border: 1px solid #044879;
        border-radius: 12px;
        padding: 28px 32px;
        margin-bottom: 28px;
      }
      .card h2 {
        font: var(--label-md);
        margin-bottom: 16px;
        color: #60a0ce;
      }
      .btn-primary {
        background: linear-gradient(135deg, #044879, #60a0ce);
        border: none;
        border-radius: 8px;
        color: white;
        font: var(--label-sm);
        padding: 10px 24px;
        cursor: pointer;
      }
      .btn-danger {
        background: none;
        border: 1px solid #7a0000;
        color: #ff5555;
        font: var(--p-sm);
        padding: 5px 10px;
        border-radius: 6px;
        cursor: pointer;
      }
      .feedback { font: var(--p-sm); margin-top: 12px; min-height: 18px; }
      .feedback.ok { color: #50fa7b; }
      .feedback.err { color: #ff5555; }
      .warning {
        border-color: #7a0000;
        background: rgba(122, 0, 0, 0.16);
        color: #ffb3b3;
        display: none;
      }
      .backups-table {
        width: 100%;
        border-collapse: collapse;
      }
      .backups-table th {
        text-align: left;
        font: var(--p-sm);
        color: #8a8a8a;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        padding: 8px 12px;
        border-bottom: 1px solid #24222e;
      }
      .backups-table td {
        padding: 10px 12px;
        font: var(--p-md);
        vertical-align: middle;
        border-bottom: 1px solid #1a1a1f;
      }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; }
      .status {
        font: 700 0.7rem/1 var(--ff-robotoMono);
        padding: 4px 8px;
        border-radius: 4px;
        text-transform: uppercase;
      }
      .status.success { background: #04304d; color: #60a0ce; border: 1px solid #60a0ce; }
      .status.failed { background: #321010; color: #ff5555; border: 1px solid #7a0000; }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        background: var(--bg-secondary);
        border: 1px solid #044879;
        border-radius: 8px;
        padding: 14px;
        max-height: 360px;
        overflow: auto;
        color: #d9e7f2;
        font: var(--p-sm);
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="brand">
        <img src="assets/logo.svg" alt="" style="width:24px;height:24px;animation:45s rotateLogo linear infinite" />
        Root<small>.ark</small>
      </div>
      <div class="topbar-right">
        <a href="/admin.html" class="btn-sm">Admin</a>
        <a href="/index.html" class="btn-sm">Voltar</a>
        <button class="btn-sm" id="btnLogout">Sair</button>
      </div>
    </div>

    <div class="page">
      <h1 class="page-title">Backups</h1>
      <p class="page-subtitle">Protecao dos metadados, banco local e arquivos fisicos do Root.ark.</p>

      <div class="card warning" id="backupWarning"></div>

      <div class="card">
        <h2>Backup manual</h2>
        <button class="btn-primary" id="btnCreateBackup">Criar backup agora</button>
        <p class="feedback" id="backupFeedback"></p>
      </div>

      <div class="card">
        <h2>Historico de backups</h2>
        <table class="backups-table">
          <thead>
            <tr>
              <th>Data</th>
              <th>Tipo</th>
              <th>Status</th>
              <th>Tamanho</th>
              <th>Acoes</th>
            </tr>
          </thead>
          <tbody id="backupsBody">
            <tr><td colspan="5" style="color:#555">Carregando...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="card" id="manifestCard" style="display:none">
        <h2>Manifest</h2>
        <pre id="manifestBox"></pre>
      </div>
    </div>

    <style>
      @keyframes rotateLogo {
        from { rotate: 90deg; }
        to   { rotate: 450deg; }
      }
    </style>

    <script src="/auth/session.js"></script>
    <script src="/auth-bootstrap.js"></script>
    <script>
      const token = "cookie-session";
      const permissions = window.ROOTARK_AUTH.permissions;

      if (!token || !(permissions.manageUsers || permissions.manageBackups)) {
        window.location.href = "/login.html";
      }

      document.getElementById("btnLogout").addEventListener("click", () => {
        window.rootarkLogout();
      });

      function authFetch(url, opts = {}) {
        return fetch(url, {
          ...opts,
          headers: {
            Authorization: "Bearer " + token,
            "Content-Type": "application/json",
            ...(opts.headers || {}),
          },
        });
      }

      function formatSize(bytes) {
        const value = Number(bytes) || 0;
        if (value < 1024) return value + " B";
        if (value < 1024 * 1024) return (value / 1024).toFixed(1) + " KB";
        if (value < 1024 * 1024 * 1024) return (value / 1024 / 1024).toFixed(1) + " MB";
        return (value / 1024 / 1024 / 1024).toFixed(1) + " GB";
      }

      function formatDate(value) {
        return value ? new Date(value).toLocaleString("pt-BR") : "-";
      }

      async function loadLatestStatus() {
        const res = await authFetch("/backups/latest-status");
        const data = await res.json();
        const warning = document.getElementById("backupWarning");
        if (data.latest?.status === "failed") {
          warning.style.display = "block";
          warning.textContent = "Aviso: o ultimo backup falhou. Erro: " + (data.latest.errorMessage || "desconhecido");
        } else {
          warning.style.display = "none";
        }
      }

      async function loadBackups() {
        await loadLatestStatus();
        const res = await authFetch("/backups");
        const data = await res.json();
        const body = document.getElementById("backupsBody");
        const backups = data.backups || [];
        if (!backups.length) {
          body.innerHTML = '<tr><td colspan="5" style="color:#555">Nenhum backup encontrado.</td></tr>';
          return;
        }

        body.innerHTML = backups.map((backup) => `
          <tr>
            <td>${formatDate(backup.createdAt)}</td>
            <td>${backup.type}</td>
            <td><span class="status ${backup.status}">${backup.status}</span></td>
            <td>${formatSize(backup.sizeBytes)}</td>
            <td>
              <div class="actions">
                <button class="btn-sm" onclick="downloadBackup('${backup.id}')">Download</button>
                <button class="btn-sm" onclick="showManifest('${backup.id}')">Manifest</button>
                <button class="btn-sm" onclick="restoreBackup('${backup.id}')">Restaurar</button>
                <button class="btn-danger" onclick="deleteBackup('${backup.id}')">Excluir</button>
              </div>
            </td>
          </tr>
        `).join("");
      }

      async function createBackup() {
        const feedback = document.getElementById("backupFeedback");
        feedback.textContent = "Criando backup...";
        feedback.className = "feedback";
        const res = await authFetch("/backups", { method: "POST", body: JSON.stringify({ notes: "Backup manual via painel" }) });
        const data = await res.json();
        if (!res.ok) {
          feedback.textContent = data.error || "Falha ao criar backup.";
          feedback.className = "feedback err";
          return;
        }
        feedback.textContent = "Backup criado com sucesso.";
        feedback.className = "feedback ok";
        loadBackups();
      }

      function downloadBackup(id) {
        window.open(`/backups/${id}/download`, "_blank");
      }

      async function showManifest(id) {
        const res = await authFetch(`/backups/${id}/manifest`);
        const data = await res.json();
        document.getElementById("manifestCard").style.display = "block";
        document.getElementById("manifestBox").textContent = JSON.stringify(data, null, 2);
      }

      async function restoreBackup(id) {
        const first = confirm("Restaurar este backup vai substituir dados atuais. Um backup pre-restore sera criado antes. Continuar?");
        if (!first) return;
        const confirmation = prompt('Digite RESTORE para confirmar a restauracao.');
        if (confirmation !== "RESTORE") return;
        const res = await authFetch(`/backups/${id}/restore`, {
          method: "POST",
          body: JSON.stringify({ confirmation }),
        });
        const data = await res.json();
        if (!res.ok) {
          alert(data.error || "Falha ao restaurar backup.");
          return;
        }
        alert(data.restartRecommended ? "Backup restaurado. Reinicie o servidor para garantir que o SQLite recarregue." : "Backup restaurado.");
        loadBackups();
      }

      async function deleteBackup(id) {
        const currentRows = document.querySelectorAll("#backupsBody tr").length;
        const message = currentRows <= 1
          ? "Este parece ser o unico backup listado. Deseja excluir mesmo assim?"
          : "Excluir este backup?";
        if (!confirm(message)) return;
        const res = await authFetch(`/backups/${id}`, { method: "DELETE" });
        const data = await res.json();
        if (!res.ok) {
          alert(data.error || "Falha ao excluir backup.");
          return;
        }
        loadBackups();
      }

      document.getElementById("btnCreateBackup").addEventListener("click", createBackup);
      loadBackups();
    </script>
  </body>
</html>
