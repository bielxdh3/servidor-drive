<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Root.ark - Dashboard</title>
    <link rel="stylesheet" href="./styles/global.css" />
    <link rel="icon" href="assets/logo.svg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght,XOPQ,XTRA,YOPQ,YTDE,YTFI,YTLC,YTUC@8..144,100..1000,96,468,79,-203,738,514,712&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Sora:wght@100..800&display=swap"
      rel="stylesheet"
    />
    <style>
      body { color: white; }

      .topbar {
        position: fixed;
        top: 0; left: 0; right: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 32px;
        background: rgba(2,2,2,0.85);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid #1a1a2e;
        z-index: 100;
      }

      .topbar .brand {
        font: 800 1.25rem/1 var(--ff-sora);
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .topbar .brand small {
        font: 700 0.9rem/1 var(--ff-sora);
        background: linear-gradient(#044879, #60a0ce);
        padding: 2px 8px;
        border-radius: 6px;
        text-transform: lowercase;
      }

      .topbar-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .btn-sm {
        background: none;
        border: 1px solid #044879;
        color: #60a0ce;
        font: var(--p-sm);
        padding: 5px 12px;
        border-radius: 6px;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
      }

      .btn-sm:hover { background: #044879; }

      .page {
        max-width: 1180px;
        margin: 0 auto;
        padding: 110px 32px 60px;
      }

      .page-title {
        font: var(--display-sm);
        margin-bottom: 8px;
      }

      .page-subtitle {
        color: #8a8a8a;
        font: var(--p-md);
        margin-bottom: 28px;
      }

      .stats-cards {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
        margin-bottom: 24px;
      }

      .stat-card,
      .chart-container,
      .activity-feed {
        background: var(--bg-tertiary);
        border: 1px solid #044879;
        border-radius: 12px;
        padding: 18px;
      }

      .stat-card h4 {
        color: white;
        font: var(--label-md);
        margin-bottom: 6px;
      }

      .stat-card p {
        color: #8a8a8a;
        font: var(--p-sm);
      }

      .charts-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .chart-container h3,
      .activity-feed h3 {
        color: #60a0ce;
        font: var(--label-sm);
        margin-bottom: 14px;
      }

      .chart-container canvas {
        max-height: 280px;
      }

      .activity-feed {
        margin-top: 18px;
      }

      .activity-feed ul {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-height: 360px;
        overflow-y: auto;
      }

      .activity-feed li {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        padding: 10px;
        border: 1px solid #044879;
        border-radius: 10px;
        background: rgba(17, 16, 18, 0.72);
      }

      .event-icon,
      .event-time {
        color: #60a0ce;
        font: var(--p-sm);
      }

      .event-text {
        color: white;
        font: var(--p-sm);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      @media (max-width: 900px) {
        .stats-cards,
        .charts-grid {
          grid-template-columns: 1fr;
        }

        .topbar {
          position: static;
          flex-direction: column;
          gap: 12px;
        }

        .page {
          padding-top: 32px;
        }
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="brand">ROOT<small>.ark</small></div>
      <div class="topbar-right">
        <a class="btn-sm" href="/index.html">Arquivos</a>
        <a class="btn-sm" href="/admin.html" id="adminLink" style="display: none">Admin</a>
        <button class="btn-sm" id="btnLogout">Sair</button>
      </div>
    </div>

    <main class="page">
      <h1 class="page-title">Dashboard</h1>
      <p class="page-subtitle">Métricas reais de uso, arquivos e atividade da plataforma.</p>

      <section class="stats-cards">
        <div class="stat-card" id="totalUploads"><h4>0</h4><p>Total de uploads</p></div>
        <div class="stat-card" id="totalDownloads"><h4>0</h4><p>Total de downloads</p></div>
        <div class="stat-card" id="activeUsers"><h4>0</h4><p>Usuários ativos hoje</p></div>
        <div class="stat-card" id="storageUsed"><h4>0 B</h4><p>Armazenamento usado</p></div>
      </section>

      <section class="charts-grid">
        <div class="chart-container">
          <h3>Uploads por mês</h3>
          <canvas id="uploadsChart"></canvas>
        </div>
        <div class="chart-container">
          <h3>Usuários ativos</h3>
          <canvas id="activeUsersChart"></canvas>
        </div>
        <div class="chart-container">
          <h3>Top arquivos baixados</h3>
          <canvas id="downloadsChart"></canvas>
        </div>
        <div class="chart-container">
          <h3>Tipos de arquivo</h3>
          <canvas id="fileTypesChart"></canvas>
        </div>
      </section>

      <section class="activity-feed">
        <h3>Atividade recente</h3>
        <ul id="recentActivity"></ul>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="/auth/session.js"></script>
    <script src="/auth-bootstrap.js"></script>
    <script>
      const token = "cookie-session";
      const permissions = window.ROOTARK_AUTH.permissions;
      if (!permissions.manageUsers && !permissions.viewAnalytics) {
        window.location.href = "/login.html";
      }
      if (permissions.manageUsers) document.getElementById("adminLink").style.display = "inline-block";
      let realtimeSocket = null;
      let realtimeRefreshTimer = null;

      document.getElementById("btnLogout").addEventListener("click", () => {
        window.rootarkLogout();
      });

      function authFetch(url, opts = {}) {
        return fetch(url, {
          ...opts,
          headers: { Authorization: "Bearer " + token, ...(opts.headers || {}) },
        }).then((response) => {
          if (response.status === 401 || response.status === 403) {
            window.location.href = "/login.html";
          }
          return response;
        });
      }

      async function authJson(url) {
        const response = await authFetch(url);
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.error || "Falha ao carregar dashboard.");
        return payload;
      }

      function formatBytes(bytes) {
        const value = Number(bytes) || 0;
        const units = ["B", "KB", "MB", "GB", "TB"];
        let size = value;
        let index = 0;
        while (size >= 1024 && index < units.length - 1) {
          size /= 1024;
          index += 1;
        }
        return `${size.toFixed(index ? 1 : 0)} ${units[index]}`;
      }

      function shortLabel(value, max = 18) {
        const text = String(value || "");
        return text.length > max ? `${text.slice(0, max - 3)}...` : text;
      }

      function renderCard(id, value, label) {
        document.getElementById(id).innerHTML = `<h4>${value}</h4><p>${label}</p>`;
      }

      const chartOptions = {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { labels: { color: "#ffffff" } },
        },
        scales: {
          x: { ticks: { color: "#8a8a8a" }, grid: { color: "rgba(4,72,121,0.25)" } },
          y: { ticks: { color: "#8a8a8a" }, grid: { color: "rgba(4,72,121,0.25)" }, beginAtZero: true },
        },
      };

      function renderChart(id, config) {
        return new Chart(document.getElementById(id), {
          ...config,
          options: { ...chartOptions, ...(config.options || {}) },
        });
      }

      function getEventIcon(type) {
        const icons = {
          upload: "UP",
          download: "DL",
          delete: "DEL",
          login: "IN",
          approval: "OK",
          rejection: "NO",
          restore: "RS",
          versionDeletion: "VD",
        };
        return icons[type] || "EV";
      }

      function formatEvent(event) {
        const user = event.username || "sistema";
        const file = event.filename || "";
        const labels = {
          upload: `${user} enviou ${file}`,
          download: `${user} baixou ${file}`,
          delete: `${user} deletou ${file}`,
          login: `${user} fez login`,
          approval: `${user} aprovou ${file}`,
          rejection: `${user} rejeitou ${file}`,
          restore: `${user} restaurou ${file}`,
          versionDeletion: `${user} deletou versao de ${file}`,
        };
        return labels[event.type] || event.type;
      }

      function formatDate(value) {
        const parsed = new Date(value);
        if (Number.isNaN(parsed.getTime())) return "";
        return new Intl.DateTimeFormat("pt-BR", { dateStyle: "short", timeStyle: "short" }).format(parsed);
      }

      async function loadDashboard() {
        const [summary, uploadsByMonth, activeUsers, topDownloads, fileTypes, recent] = await Promise.all([
          authJson("/analytics/summary"),
          authJson("/analytics/uploads-by-month?months=6"),
          authJson("/analytics/active-users?days=30"),
          authJson("/analytics/downloads-by-file?limit=10"),
          authJson("/analytics/file-types"),
          authJson("/analytics/recent?limit=20"),
        ]);

        renderCard("totalUploads", summary.totalUploads, "Total de uploads");
        renderCard("totalDownloads", summary.totalDownloads, "Total de downloads");
        renderCard("activeUsers", summary.activeUsersToday, "Usuários ativos hoje");
        renderCard("storageUsed", formatBytes(summary.storageUsed), "Armazenamento usado");

        renderChart("uploadsChart", {
          type: "line",
          data: {
            labels: uploadsByMonth.map((item) => item.month),
            datasets: [{
              label: "Uploads",
              data: uploadsByMonth.map((item) => item.count),
              borderColor: "#60a0ce",
              backgroundColor: "rgba(96,160,206,0.16)",
              tension: 0.3,
              fill: true,
            }],
          },
        });

        renderChart("activeUsersChart", {
          type: "line",
          data: {
            labels: activeUsers.map((item) => item.date.slice(5)),
            datasets: [{
              label: "Usuários",
              data: activeUsers.map((item) => item.uniqueUsers),
              borderColor: "#60a0ce",
              backgroundColor: "rgba(4,72,121,0.24)",
              tension: 0.3,
            }],
          },
        });

        renderChart("downloadsChart", {
          type: "bar",
          data: {
            labels: topDownloads.map((item) => shortLabel(item.filename)),
            datasets: [{
              label: "Downloads",
              data: topDownloads.map((item) => item.downloads),
              backgroundColor: "#044879",
              borderColor: "#60a0ce",
              borderWidth: 1,
            }],
          },
        });

        renderChart("fileTypesChart", {
          type: "doughnut",
          data: {
            labels: fileTypes.slice(0, 8).map((item) => item.extension),
            datasets: [{
              data: fileTypes.slice(0, 8).map((item) => item.count),
              backgroundColor: ["#044879", "#0d5f3f", "#60a0ce", "#2b2640", "#6b4b00", "#24222e", "#1d9b63", "#7d65c7"],
              borderColor: "#111012",
            }],
          },
          options: { scales: {} },
        });

        const recentActivity = document.getElementById("recentActivity");
        recentActivity.textContent = "";
        if (!recent.length) recentActivity.textContent = "Nenhuma atividade registrada ainda.";
        recent.forEach((event) => {
          const item = document.createElement("li");
          for (const [className, text] of [["event-icon", getEventIcon(event.type)], ["event-text", formatEvent(event)], ["event-time", formatDate(event.timestamp)]]) {
            const span = document.createElement("span"); span.className = className; span.textContent = text; item.append(span);
          }
          item.querySelector(".event-text").title = formatEvent(event);
          recentActivity.append(item);
        });
      }

      loadDashboard().catch((error) => {
        document.getElementById("recentActivity").textContent = error.message || "Falha ao carregar dashboard.";
      });

      function connectRealtime() {
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        realtimeSocket = new WebSocket(`${protocol}//${window.location.host}/ws`);
        realtimeSocket.addEventListener("message", (event) => {
          let message = {};
          try { message = JSON.parse(event.data); } catch { return; }
          if (message.event === "data:changed" && ["analytics", "audit", "history", "pending"].includes(message.payload?.source)) {
            clearTimeout(realtimeRefreshTimer);
            realtimeRefreshTimer = setTimeout(() => window.location.reload(), 500);
          }
        });
        realtimeSocket.addEventListener("close", () => setTimeout(connectRealtime, 3000));
      }

      connectRealtime();
    </script>
  </body>
</html>
