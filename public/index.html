<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drive - biel.dev.br</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 100%);
      color: #e0e0e0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      padding: 20px;
    }

    .container { max-width: 1200px; margin: 0 auto; }

    h1 {
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 40px;
      background: linear-gradient(90deg, #00d4ff, #7b2ff7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .upload-box {
      background: rgba(255, 255, 255, 0.05);
      border: 2px dashed rgba(0, 212, 255, 0.3);
      border-radius: 15px;
      padding: 60px 40px;
      margin-bottom: 40px;
      text-align: center;
      transition: all 0.3s;
      cursor: pointer;
    }

    .upload-box.dragover {
      border-color: #00d4ff;
      background: rgba(0, 212, 255, 0.1);
      transform: scale(1.01);
    }

    .upload-label {
      display: block;
      font-size: 1.1rem;
      color: #aaa;
      margin-bottom: 15px;
    }

    #form {
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }

    button {
      padding: 12px 30px;
      background: linear-gradient(90deg, #00d4ff, #7b2ff7);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
    }

    button:active { transform: translateY(0); }

    .section { margin-bottom: 40px; }

    h2 { margin-bottom: 20px; font-size: 1.5rem; color: #00d4ff; }

    ul { list-style: none; }

    li {
      background: rgba(255, 255, 255, 0.05);
      margin-bottom: 10px;
      padding: 15px 20px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
    }

    li:hover { background: rgba(255, 255, 255, 0.1); transform: translateX(5px); }

    li a { color: #00d4ff; text-decoration: none; flex: 1; }
    li a:hover { text-decoration: underline; }

    .btn-group { display: flex; gap: 10px; }

    .btn-small { padding: 8px 16px; font-size: 0.9rem; }

    .btn-approve { background: linear-gradient(90deg, #00ff87, #60efff); }
    .btn-reject, .btn-delete { background: linear-gradient(90deg, #ff6b6b, #ee5a6f); }

    @media (max-width: 768px) {
      h1 { font-size: 2rem; }
      .upload-box { padding: 20px; }
      li { flex-direction: column; gap: 10px; align-items: flex-start; }
      .btn-group { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🐱‍👤 Drive - biel.dev.br</h1>

    <div class="upload-box" id="dropzone">
      <form id="form">
        <span class="upload-label">📂 Arraste arquivos aqui ou clique para escolher</span>
        <input type="file" name="file" id="fileInput" style="display:none" />
        <button type="button" onclick="document.getElementById('fileInput').click()">📤 Escolher Arquivo</button>
      </form>
    </div>

    <div class="section">
      <h2>📁 Arquivos Públicos</h2>
      <ul id="lista"></ul>
    </div>

    <div class="section">
      <h2>⏳ Aguardando Aprovação</h2>
      <ul id="pendentes"></ul>
    </div>
  </div>

  <script>
    const dropzone = document.getElementById("dropzone");
    const fileInput = document.getElementById("fileInput");
    const lista = document.getElementById("lista");
    const pendentes = document.getElementById("pendentes");

    async function enviarArquivo(file) {
      const data = new FormData();
      data.append("file", file);
      await fetch("/upload", { method: "POST", body: data });
      loadFiles();
      loadPending();
    }

    fileInput.onchange = () => {
      if (fileInput.files[0]) enviarArquivo(fileInput.files[0]);
    };

    dropzone.ondragover = (e) => {
      e.preventDefault();
      dropzone.classList.add("dragover");
    };

    dropzone.ondragleave = () => {
      dropzone.classList.remove("dragover");
    };

    dropzone.ondrop = (e) => {
      e.preventDefault();
      dropzone.classList.remove("dragover");
      const file = e.dataTransfer.files[0];
      if (file) enviarArquivo(file);
    };

    async function loadFiles() {
      const res = await fetch("/list");
      const files = await res.json();
      lista.innerHTML = files.length
        ? files.map(f => `
            <li>
              <a href="/files/${f}" target="_blank">📄 ${f}</a>
              <div class="btn-group">
                <button class="btn-small btn-delete" onclick="excluir('${f}')">🗑️ Excluir</button>
              </div>
            </li>`).join("")
        : "<li>Nenhum arquivo ainda.</li>";
    }

    async function loadPending() {
      const res = await fetch("/pending");
      const files = await res.json();
      pendentes.innerHTML = files.length
        ? files.map(f => `
            <li>
              <span>📄 ${f}</span>
              <div class="btn-group">
                <button class="btn-small btn-approve" onclick="aprovar('${f}')">✅ Aprovar</button>
                <button class="btn-small btn-reject" onclick="rejeitar('${f}')">❌ Rejeitar</button>
              </div>
            </li>`).join("")
        : "<li>Nenhum arquivo pendente.</li>";
    }

    async function aprovar(nome) {
      await fetch("/approve/" + nome);
      loadFiles();
      loadPending();
    }

    async function rejeitar(nome) {
      await fetch("/reject/" + nome);
      loadPending();
    }

    async function excluir(nome) {
      if (!confirm(`Excluir ${nome}?`)) return;
      await fetch("/delete/" + nome);
      loadFiles();
    }

    loadFiles();
    loadPending();
    setInterval(() => { loadFiles(); loadPending(); }, 1000);
  </script>
</body>
</html>
